<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>mst.matrix – Full‑featured Matrix Web Client</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css" integrity="sha512-8mM0TBGpBa7SMOLN6XcV1ChwEDlCAzTSqR7sX/r0HMHQx0XWWvXUOBhXQBlHzuhZldQVCTq6XOk6kEsNIA1C8w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>mst.matrix – Full‑featured Matrix Web Client</h2>

  <!-- Login form -->
  <div id="login">
    <h3>Login</h3>
    <label>Homeserver URL <input type="text" id="homeserver" placeholder="https://matrix.org" required/></label>
    <label>User ID (e.g. @user:matrix.org) <input type="text" id="userId" required/></label>
    <label>Password <input type="password" id="password" required/></label>
    <button id="loginBtn">Login</button>
    <p id="loginStatus" style="color:red;"></p>
  </div>

  <!-- Main client UI -->
  <div id="client" style="display:none;">
    <button id="logoutBtn" style="margin-bottom:10px;">Logout</button>
    <div class="grid">
      <div class="column column-30" id="sidebar">
        <h4>Rooms</h4>
        <ul id="roomList"></ul>
        <hr/>
        <h5>Create / Join</h5>
        <label>Room name / alias <input type="text" id="newRoomName" placeholder="#myroom:matrix.org"/></label>
        <button id="createRoomBtn">Create / Join</button>
      </div>
      <div class="column column-70" id="chatPane">
        <h4 id="roomTitle">Select a room</h4>
        <div id="messages" class="messageBox"></div>
        <div id="typing" style="font-style:italic; color:#555;"></div>
        <div class="inputArea">
          <textarea id="msgInput" rows="2" placeholder="Type a message…"></textarea>
          <input type="file" id="fileInput" multiple style="margin-top:5px;" />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/matrix-js-sdk@latest/lib/index.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mst.matrix – Material You Matrix Client</title>
  <!-- Material You Web Components -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@material/web@latest/material-web.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top App Bar -->
  <md-standard-top-app-bar>
    <div slot="title">mst.matrix</div>
    <md-standard-icon-button slot="navigationIcon" id="menuBtn" aria-label="Menu">
      <svg slot="icon" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
    </md-standard-icon-button>
  </md-standard-top-app-bar>

  <!-- Navigation drawer (rooms) -->
  <md-drawer id="drawer" type="modal">
    <md-drawer-header>
      <div slot="title">Rooms</div>
    </md-drawer-header>
    <md-drawer-content>
      <md-list id="roomList"></md-list>
    </md-drawer-content>
    <md-drawer-footer>
      <md-filled-button id="createRoomBtn" style="width:100%; margin-top:8px;">Create / Join</md-filled-button>
      <md-filled-text-field id="newRoomName" label="Room name or alias" style="width:100%; margin-top:8px;" placeholder="#room:example.org"></md-filled-text-field>
    </md-drawer-footer>
  </md-drawer>

  <!-- Main content -->
  <div id="mainContent" style="padding:16px;">
    <!-- Login view -->
    <div id="login" class="centered">
      <md-card style="max-width:400px; margin:auto; padding:24px;">
        <h3 style="margin-top:0; text-align:center;">Login to Matrix</h3>
        <md-filled-text-field id="homeserver" label="Homeserver URL" value="https://matrix.org" style="width:100%; margin-top:12px;"></md-filled-text-field>
        <md-filled-text-field id="userId" label="User ID" style="width:100%; margin-top:12px;"></md-filled-text-field>
        <md-filled-text-field id="password" label="Password" type="password" style="width:100%; margin-top:12px;"></md-filled-text-field>
        <md-filled-button id="loginBtn" style="width:100%; margin-top:24px;">Login</md-filled-button>
        <p id="loginStatus" class="error" style="color:red; margin-top:8px; text-align:center;"></p>
      </md-card>
    </div>

    <!-- Client UI (hidden until logged in) -->
    <div id="client" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="roomTitle" style="margin:0;">Select a room</h4>
        <md-outlined-button id="logoutBtn">Logout</md-outlined-button>
      </div>
      <div id="messages" class="message-container"></div>
      <p id="typing" class="typing-indicator"></p>
      <div class="input-area d-flex" style="gap:8px; margin-top:12px;">
        <md-outline-text-field id="msgInput" label="Message" style="flex:1;" rows="2"></md-outline-text-field>
        <input type="file" id="fileInput" multiple />
        <md-filled-button id="sendBtn">Send</md-filled-button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

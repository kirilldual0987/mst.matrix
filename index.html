<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mst.matrix – Material You Matrix Client</title>
  <!-- Material Web Components (MDC) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@material/web@latest/material-web.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top App Bar with menu, settings, and theme toggle -->
  <md-standard-top-app-bar id="topBar"
                      headline="mst.matrix"
                      leadingIcon="menu"
                      trailingIcon="more_vert">
    <!-- The "more_vert" icon opens a small menu with Settings and Theme toggle -->
  </md-standard-top-app-bar>

  <!-- Settings dialog (Material dialog) -->
  <md-dialog id="settingsDialog" type="alert">
    <md-dialog-title>Settings</md-dialog-title>
    <md-dialog-content>
      <md-switch id="darkModeSwitch" label="Dark mode"></md-switch>
    </md-dialog-content>
    <md-dialog-actions>
      <md-text-button dialogDismiss>Close</md-text-button>
    </md-dialog-actions>
  </md-dialog>

  <!-- Navigation drawer (rooms) -->
  <md-drawer id="drawer" type="modal">
    <md-drawer-header>
      <div slot="title">Rooms</div>
    </md-drawer-header>
    <md-drawer-content>
      <md-list id="roomList"></md-list>
    </md-drawer-content>
    <md-drawer-footer>
      <div style="padding:8px;">
        <md-filled-text-field id="newRoomName" label="Room name or alias"
                               placeholder="#room:example.org"
                               style="width:100%;"/>
        <md-filled-button id="createRoomBtn" style="width:100%; margin-top:8px;"
                              >Create / Join</md-filled-button>
      </div>
    </md-drawer-footer>
  </md-drawer>

  <!-- Main content area -->
  <div id="mainContent" class="container" style="margin-top:16px;">
    <!-- Login view (centered) -->
    <div id="login" class="centered">
      <md-card style="max-width:400px; margin:auto; padding:24px;">
        <h3 style="margin-top:0; text-align:center;">Login to Matrix</h3>
        <md-filled-text-field id="homeserver" label="Homeserver URL"
                                   value="https://matrix.org" style="width:100%; margin-top:12px;"/>
        <md-filled-text-field id="userId" label="User ID"
                                   style="width:100%; margin-top:12px;"/>
        <md-filled-text-field id="password" label="Password" type="password"
                                   style="width:100%; margin-top:12px;"/>
        <md-filled-button id="loginBtn" style="width:100%; margin-top:24px;"
                           >Login</md-filled-button>
        <p id="loginStatus" class="error" style="color:red; margin-top:8px; text-align:center;"></p>
      </md-card>
    </div>

    <!-- Client UI (hidden until auth) -->
    <div id="client" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="roomTitle" style="margin:0;">Select a room</h4>
        <!-- Placeholder for future user profile/avatar button -->
      </div>
      <div id="messages" class="message-container"></div>
      <p id="typing" class="typing-indicator"></p>
      <!-- Search box -->
      <div class="d-flex" style="margin-top:8px;">
        <md-outlined-text-field id="searchInput" label="Search messages"
                                   style="flex:1; margin-right:8px;"/>
        <md-icon-button id="clearSearchBtn" aria-label="Clear search"
                            ><svg slot="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </md-icon-button>
      </div>
      <div class="input-area d-flex" style="gap:8px; margin-top:12px;">
        <md-outline-text-field id="msgInput" label="Message" rows="2" style="flex:1;"></md-outline-text-field>
        <input type="file" id="fileInput" multiple />
        <md-filled-button id="sendBtn">Send</md-filled-button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

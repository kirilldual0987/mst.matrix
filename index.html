<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mst.matrix – Modern Matrix Web Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa8mYgK4DHSNHRJhvHu9pZVc2si5EvGDaIIgSywzQj9d+g8nGx6NKGK2x9b" crossorigin="anonymous" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">mst.matrix</a>
    </div>
  </nav>

  <!-- Main container -->
  <div class="container-fluid flex-grow-1 d-flex" style="margin-top:1rem;">
    <!-- Login view (shown until authenticated) -->
    <div id="login" class="row w-100 justify-content-center align-items-center">
      <div class="col-md-4">
        <h3 class="text-center mb-4">Login to Matrix</h3>
        <div class="mb-3">
          <label for="homeserver" class="form-label">Homeserver URL</label>
          <input type="text" class="form-control" id="homeserver" placeholder="https://matrix.org" required />
        </div>
        <div class="mb-3">
          <label for="userId" class="form-label">User ID (e.g. @user:matrix.org)</label>
          <input type="text" class="form-control" id="userId" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Login</button>
        <p id="loginStatus" class="text-danger mt-2"></p>
      </div>
    </div>

    <!-- Main client UI (hidden until logged in) -->
    <div id="client" class="row w-100 d-none" style="flex-grow:1;">
      <!-- Sidebar with rooms -->
      <div class="col-md-3 border-end" id="sidebar">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Rooms</h5>
          <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
        </div>
        <ul class="list-group" id="roomList"></ul>
        <hr>
        <h6 class="mt-3">Create / Join Room</h6>
        <div class="input-group mb-2">
          <input type="text" class="form-control" id="newRoomName" placeholder="#room:example.org" />
          <button class="btn btn-success" id="createRoomBtn">Create/Join</button>
        </div>
      </div>
      <!-- Chat pane -->
      <div class="col-md-9 d-flex flex-column" id="chatPane">
        <h5 id="roomTitle" class="mb-2">Select a room</h5>
        <div id="messages" class="flex-grow-1 mb-2 overflow-auto p-2 border rounded" style="background:#f8f9fa;"></div>
        <div id="typing" class="text-muted mb-1" style="height:1.2em;"></div>
        <div class="input-group">
          <textarea class="form-control" id="msgInput" rows="2" placeholder="Type a message…"></textarea>
          <input type="file" class="form-control" id="fileInput" multiple aria-label="Upload files" style="max-width:150px;" />
          <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/matrix-js-sdk@latest/lib/index.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+8apG9ng5stSKv4B8YBz0A0X5+9Bp" crossorigin="anonymous"></script>
</body>
</html>
